{% extends "base.html" %}{% block title %}Новый пароль{% endblock %}
{% block content %}
<div class="card auth form-card" style="max-width:440px">
  <h2>Новый пароль</h2>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for f in form.visible_fields %}
      <label>{{ f.label }}</label>
      {{ f }}{{ f.errors }}
    {% endfor %}
    {% include "accounts/_password_help.html" %}
    <p style="margin-top:14px"><button type="submit" style="width:100%">Сохранить</button></p>
  </form>
</div>
{% endblock %}
