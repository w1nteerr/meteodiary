{# требования к паролю и кнопка «показать»; подключается в формах с паролем #}
<div class="pw-req" id="pw-req" hidden>
  <div class="pw-req-title">Пароль должен содержать</div>
  <ul>
    <li data-rule="len"><span class="pw-dot"></span>не менее 8 символов</li>
    <li data-rule="letter"><span class="pw-dot"></span>хотя бы одну букву</li>
    <li data-rule="digit"><span class="pw-dot"></span>хотя бы одну цифру</li>
    <li data-rule="notlogin"><span class="pw-dot"></span>не совпадает с логином и почтой</li>
  </ul>
</div>
<script>
// Показ/скрытие пароля и живая проверка требований.
(function () {
  const fields = [...document.querySelectorAll('input[type="password"]')];
  if (!fields.length) return;

  // кнопка-глазик у каждого поля пароля
  fields.forEach(inp => {
    const wrap = document.createElement("div");
    wrap.className = "pw-wrap";
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);

    // Иконки рисуем SVG, а не эмодзи: эмодзи выглядят по-разному в разных
    // системах и почти не видны на светлом фоне.
    const EYE = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>' +
      '<circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M2 12s3.6-7 10-7c2 0 3.8.7 5.2 1.6M22 12s-3.6 7-10 7c-2 0-3.8-.7-5.2-1.6"/>' +
      '<path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>';

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "pw-eye";
    btn.setAttribute("aria-label", "Показать пароль");
    btn.innerHTML = EYE;
    btn.addEventListener("click", () => {
      const shown = inp.type === "text";
      inp.type = shown ? "password" : "text";
      btn.innerHTML = shown ? EYE : EYE_OFF;
      btn.setAttribute("aria-label", shown ? "Показать пароль" : "Скрыть пароль");
      inp.focus();
    });
    wrap.appendChild(btn);
  });

  // подсказку показываем у первого поля пароля, когда в него начали вводить
  const first = fields[0];
  const req = document.getElementById("pw-req");
  if (!req) return;
  first.parentNode.parentNode.insertBefore(req, first.parentNode.nextSibling);

  const login = document.querySelector('input[name="username"]');
  const email = document.querySelector('input[name="email"]');

  function check() {
    const v = first.value;
    const rules = {
      len: v.length >= 8,
      letter: /[a-zA-Zа-яА-Я]/.test(v),
      digit: /\d/.test(v),
      notlogin: v.length > 0
        && (!login || !login.value || !v.toLowerCase().includes(login.value.toLowerCase()))
        && (!email || !email.value || !v.toLowerCase().includes(email.value.split("@")[0].toLowerCase())),
    };
    for (const [name, ok] of Object.entries(rules)) {
      const li = req.querySelector(`[data-rule="${name}"]`);
      if (li) li.classList.toggle("ok", ok);
    }
  }
  first.addEventListener("input", () => { req.hidden = false; check(); });
  first.addEventListener("focus", () => { req.hidden = false; check(); });
  [login, email].forEach(el => el && el.addEventListener("input", check));
})();
</script>
